<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="45%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="clayTopSheen" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="clayShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#881337" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.18" />
    </filter>
    <filter id="sparkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#fef08a" flood-opacity="0.8" />
    </filter>
  </defs>

  <g filter="url(#clayShadow)">
    <rect x="32" y="32" width="448" height="448" rx="120" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="14" stroke-opacity="0.9" />
    <rect x="32" y="32" width="448" height="448" rx="120" fill="url(#clayTopSheen)" />
  </g>

  <g stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" opacity="0.96">
    <line x1="148" y1="200" x2="364" y2="200" stroke-width="32" />
    <line x1="148" y1="312" x2="364" y2="312" stroke-width="32" />
    <line x1="200" y1="148" x2="200" y2="364" stroke-width="32" />
    <line x1="312" y1="148" x2="312" y2="364" stroke-width="32" />
    <line x1="168" y1="168" x2="344" y2="344" stroke-width="16" opacity="0.75" />
    <line x1="344" y1="168" x2="168" y2="344" stroke-width="16" opacity="0.75" />
  </g>

  <circle cx="200" cy="200" r="24" fill="#ffffff" />
  <circle cx="312" cy="200" r="24" fill="#ffffff" />
  <circle cx="200" cy="312" r="24" fill="#ffffff" />
  <circle cx="312" cy="312" r="24" fill="#ffffff" />

  <circle cx="256" cy="256" r="32" fill="#ffffff" />
  <circle cx="256" cy="256" r="14" fill="#f43f5e" />

  <g filter="url(#sparkGlow)" transform="translate(378, 134)">
    <path d="M0 -34 C1 -12 12 -1 34 0 C12 1 1 12 0 34 C-1 12 -12 1 -34 0 C-12 -1 -1 -12 0 -34 Z" fill="url(#starGrad)" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
  </g>
</svg>
